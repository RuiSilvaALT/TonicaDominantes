<!DOCTYPE html><html lang="pt"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tónica e Dominantes – Treino e Exercício</title><style>
:root{font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:#18233a;background:#f3f6fb}*{box-sizing:border-box}body{margin:0;padding:24px}main{max-width:820px;margin:25px auto;background:white;border-radius:22px;padding:30px;box-shadow:0 12px 36px #18233a14}h1{margin:0 0 10px;font-size:clamp(25px,4vw,35px)}.muted{color:#65718a}.controls{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin:22px 0}select,button{font:inherit;padding:13px 17px;border-radius:12px;border:1px solid #ccd4e2}button{cursor:pointer;background:#1e58b9;color:white;border:0;font-weight:650}button.secondary{background:#e9effa;color:#1e4b93}button:disabled{opacity:.45;cursor:not-allowed}select{background:white;min-width:170px}.mode{display:flex;gap:10px;margin:18px 0}.mode button.active{background:#153d83;color:white}.mode button:not(.active){background:#e9effa;color:#1e4b93}.panel{border:1px solid #dbe3f0;border-radius:16px;padding:22px;min-height:220px}.status{font-size:19px;font-weight:650;min-height:35px}.progress{color:#5c6880;min-height:26px}.solution{margin-top:18px;padding:16px;background:#f1f5fc;border-radius:12px}.solution ol{padding-left:26px;columns:2;line-height:2}.note{font-size:14px;color:#68748b;margin-top:22px}@media(max-width:550px){main{padding:20px}.solution ol{columns:1}}
</style></head><body><main><h1>Tónica e Dominantes</h1><p class="muted">Treino e Exercício · Cada som será tocado 2 vezes.</p><div class="controls"><label for="ton">Tonalidade</label><select id="ton"><option value="1">Tonalidade 1</option><option value="2">Tonalidade 2</option><option value="3">Tonalidade 3</option></select></div><div class="mode"><button id="trainMode" class="active">Treino</button><button id="testMode">Exercício</button></div><section class="panel"><div id="status" class="status" aria-live="polite">Escolhe uma tonalidade e inicia o treino.</div><div id="progress" class="progress"></div><div class="controls"><button id="start">Treino</button><button id="stop" class="secondary">Parar áudio</button><button id="solutionBtn" class="secondary" hidden disabled>Mostrar solução</button></div><div id="solution" class="solution" hidden></div></section><p class="note">No exercício, os nomes dos sons só são apresentados na solução, depois de concluídas as 10 perguntas.</p></main><script>
const tones={tonalidade:'Tonalidade.mp3',tonica:'Tonica.mp3',cima:'DominanteCima.mp3',baixo:'DominanteBaixo.mp3'};
const labels={tonica:'Tónica',cima:'Dominante em cima',baixo:'Dominante em baixo'};
const keys=['tonica','cima','baixo'];
const ton=document.getElementById('ton'),trainMode=document.getElementById('trainMode'),testMode=document.getElementById('testMode'),start=document.getElementById('start'),stopBtn=document.getElementById('stop'),solutionBtn=document.getElementById('solutionBtn'),statusEl=document.getElementById('status'),progress=document.getElementById('progress'),solution=document.getElementById('solution');
let mode='train',runId=0,currentAudio=null,pendingWait=null,answers=[];
function cancel(){runId++;if(currentAudio){currentAudio.pause();currentAudio.currentTime=0;currentAudio=null}if(pendingWait){clearTimeout(pendingWait.timer);pendingWait.resolve();pendingWait=null}start.disabled=false}
function reset(){cancel();answers=[];solution.hidden=true;solution.textContent='';solutionBtn.disabled=true;solutionBtn.hidden=mode!=='test';progress.textContent='';statusEl.textContent=mode==='train'?'Pronto para iniciar o treino.':'Pronto para iniciar o exercício.';start.textContent=mode==='train'?'Treino':'Iniciar exercício';trainMode.classList.toggle('active',mode==='train');testMode.classList.toggle('active',mode==='test')}
function delay(ms,id){return new Promise(resolve=>{if(id!==runId)return resolve();const timer=setTimeout(()=>{pendingWait=null;resolve()},ms);pendingWait={timer,resolve}})}
function play(key,id){return new Promise((resolve,reject)=>{if(id!==runId)return resolve();const a=new Audio(`audio/tonalidade${ton.value}/${tones[key]}`);currentAudio=a;a.volume=1;a.preload='auto';let done=false;const finish=()=>{if(done)return;done=true;if(currentAudio===a)currentAudio=null;resolve()};a.onended=finish;a.onerror=()=>{finish();reject(new Error('Não foi possível carregar '+tones[key]))};a.play().catch(e=>{finish();reject(e)})})}
async function twice(key,id){await play(key,id);if(id!==runId)return;await delay(300,id);if(id!==runId)return;await play(key,id)}
async function execute(){cancel();const id=runId;const selectedTone=ton.value;start.disabled=true;solution.hidden=true;solutionBtn.disabled=true;answers=[];try{statusEl.textContent='A ouvir a tonalidade…';progress.textContent='';await play('tonalidade',id);if(id!==runId)return;await delay(300,id);if(id!==runId)return;if(mode==='train'){for(let i=0;i<keys.length;i++){if(id!==runId)return;const key=keys[i];statusEl.textContent=labels[key];progress.textContent=`Som ${i+1} de 3`;await twice(key,id);if(id!==runId)return;if(i<keys.length-1)await delay(300,id)}if(id!==runId)return;statusEl.textContent='Treino concluído.'}else{answers=Array.from({length:10},()=>keys[Math.floor(Math.random()*keys.length)]);for(let i=0;i<10;i++){if(id!==runId)return;statusEl.textContent='Ouve atentamente e identifica o som.';progress.textContent=`Som ${i+1} de 10`;await twice(answers[i],id);if(id!==runId)return;if(i<9)await delay(300,id)}if(id!==runId)return;statusEl.textContent='Exercício concluído!';progress.textContent='Já podes consultar a solução.';solutionBtn.disabled=false}}catch(err){if(id===runId){statusEl.textContent='Não foi possível reproduzir o áudio.';progress.textContent='Confirma que a pasta audio está junto do index.html. '+(err.message||'')}}finally{if(id===runId)start.disabled=false}}
trainMode.addEventListener('click',()=>{mode='train';reset()});testMode.addEventListener('click',()=>{mode='test';reset()});ton.addEventListener('change',reset);start.addEventListener('click',execute);stopBtn.addEventListener('click',()=>{cancel();statusEl.textContent='Áudio interrompido.';progress.textContent='';solutionBtn.disabled=true;answers=[]});solutionBtn.addEventListener('click',()=>{if(solutionBtn.disabled||answers.length!==10)return;solution.innerHTML='<strong>Solução</strong><ol>'+answers.map(k=>`<li>${labels[k]}</li>`).join('')+'</ol>';solution.hidden=false});reset();
</script></body></html>
